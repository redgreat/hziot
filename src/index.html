<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f0d">
<title>MotionPulse 运动传感器 · 实时监测</title>
<style>
:root{color-scheme:dark;--bg:#0a0f0d;--panel:#111a15;--panel2:#15211a;--line:#22352b;--text:#eef5f0;--muted:#8fa79a;--lime:#b6f34a;--cyan:#41d5d7;--red:#ff6b6b;--amber:#ffc94d;font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
body{display:flex;flex-direction:column;overflow:hidden}
/* ---------- header ---------- */
header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#10190f,#0a0f0d);flex:none}
.brand{display:flex;gap:11px;align-items:center}
.brand-mark{width:36px;height:36px;border-radius:11px;background:var(--lime);display:grid;place-items:center;color:#15230a;font-weight:900;font-size:1.1rem}
.brand b{font-size:1.02rem}
.brand small{display:block;color:var(--muted);font-size:.72rem;font-weight:400}
header .spacer{flex:1}
select,input{background:#13221a;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem}
header select{max-width:220px}
.user{color:var(--muted);font-size:.85rem}
.btn{border:0;border-radius:11px;padding:.62rem 1rem;font-weight:700;background:var(--lime);color:#15230a;min-height:40px}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.secondary{background:#1b2c21;color:var(--text);border:1px solid var(--line)}
/* ---------- layout ---------- */
main{flex:1;display:grid;grid-template-columns:264px 1fr 330px;gap:12px;padding:12px;min-height:0}
.left,.right{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.center{display:flex;flex-direction:column;gap:12px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.panel-head h2{margin:0;font-size:.95rem}
.pill{background:#1b2c21;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:700}
.pill.ok{color:var(--lime);border-color:#3a5220}
.pill.warn{color:var(--amber);border-color:#5a4a1a}
.pill.run{color:var(--cyan);border-color:#1c4a4b}
/* ---------- devices ---------- */
.device-list{display:grid;gap:8px}
.device{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:10px 12px;color:var(--text)}
.device:hover{border-color:#3a5a46}
.device.active{border-color:var(--lime);background:#17250f}
.device .dot{width:9px;height:9px;border-radius:50%;background:#4a5c50;flex:none}
.device .dot.online{background:var(--lime);box-shadow:0 0 8px #b6f34a88}
.device strong{font-size:.9rem;font-weight:750}
.device small{display:block;color:var(--muted);font-size:.74rem;margin-top:2px}
/* ---------- metrics ---------- */
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.metric label{display:block;color:var(--muted);font-size:.72rem;margin-bottom:6px;letter-spacing:.04em}
.metric b{font-size:1.5rem;font-weight:800;line-height:1}
.metric span.unit{font-size:.8rem;color:var(--muted);font-weight:600;margin-left:3px}
.metric small{display:block;color:var(--muted);font-size:.72rem;margin-top:6px}
/* ---------- attitude ---------- */
.attitude-wrap{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center}
canvas{display:block}
#attitude-canvas{width:150px;height:150px}
#wave-canvas{width:100%;height:150px}
.axis-values{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.axis-values div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.axis-values label{display:block;color:var(--muted);font-size:.7rem;margin-bottom:3px}
.axis-values b{font-size:.92rem}
/* ---------- map ---------- */
.map-card{position:relative;flex:1;min-height:320px;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
#map{position:relative;flex:1;min-height:260px;cursor:grab;touch-action:none}
#map.dragging{cursor:grabbing}
#tiles{position:absolute;inset:0;overflow:hidden}
#tiles img{position:absolute;user-select:none;-webkit-user-drag:none}
#map-canvas{position:absolute;inset:0;pointer-events:none}
.map-overlay{position:absolute;z-index:5;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.map-overlay button{width:34px;height:34px;border-radius:10px;background:#10190fee;border:1px solid var(--line);color:var(--text);font-weight:800}
.map-caption{position:absolute;z-index:5;left:12px;bottom:10px;background:#0a0f0dd9;border:1px solid var(--line);border-radius:12px;padding:8px 12px;max-width:70%}
.map-caption strong{display:block;font-size:.85rem}
.map-caption span{color:var(--muted);font-size:.74rem}
.attribution{position:absolute;z-index:5;right:6px;bottom:4px;background:#ffffffd9;color:#222;padding:2px 6px;font-size:10px;border-radius:6px}
.attribution a{color:#1650a0}
/* ---------- history & chart ---------- */
.history{display:grid;gap:10px}
.date-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.date-row label{color:var(--muted);font-size:.78rem}
.history-actions{display:flex;gap:8px}
.history-actions .btn{min-height:36px;padding:.4rem .9rem;font-size:.82rem}
#speed-chart{width:100%;height:120px}
/* ---------- telemetry list ---------- */
.telemetry-list{display:grid;gap:9px}
.telemetry-list>div{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #1d2f25;padding-bottom:8px}
.telemetry-list>div:last-child{border-bottom:0;padding-bottom:0}
.telemetry-list label{color:var(--muted);font-size:.8rem}
.telemetry-list b{font-size:.86rem;font-weight:700}
.bars{display:inline-flex;gap:3px;align-items:flex-end;height:14px;margin-right:7px;vertical-align:-2px}
.bars i{width:4px;background:#2c4436;border-radius:2px;display:block}
.bars i.on{background:var(--lime)}
/* ---------- page states ---------- */
.page-state{position:fixed;inset:0;background:#0a0f0df2;display:grid;place-items:center;z-index:50}
.state-card{text-align:center;max-width:420px;padding:30px}
.state-card h2{margin:.8rem 0 .4rem}
.state-card p{color:var(--muted);line-height:1.7;margin:0 0 18px}
.spinner{width:30px;height:30px;margin:0 auto;border:3px solid #ffffff22;border-top-color:var(--lime);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1b2c21;border:1px solid var(--line);color:var(--text);padding:.7rem 1.1rem;border-radius:12px;z-index:60;box-shadow:0 12px 30px #0007;font-size:.86rem}
/* ---------- responsive ---------- */
@media(max-width:1080px){main{grid-template-columns:1fr;overflow:auto}.left,.right{overflow:visible}.center{min-height:520px}}
@media(max-width:640px){header{flex-wrap:wrap}.metrics{grid-template-columns:repeat(2,1fr)}.attitude-wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-mark">M</div><div><b>MotionPulse</b><small>合宙 Air8202 · 运动传感器监测台</small></div></div>
  <div class="spacer"></div>
  <select id="project-select" aria-label="选择项目"></select>
  <span id="refresh-pill" class="pill run">实时同步中</span>
  <span id="user-name" class="user"></span>
  <button id="logout" class="btn secondary" type="button">退出登录</button>
</header>

<main>
  <aside class="left">
    <section class="panel" style="flex:none">
      <div class="panel-head"><h2>我的设备</h2><span id="device-count" class="pill">0</span></div>
      <div id="device-list" class="device-list"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>速度曲线</h2><span class="pill">最近上报</span></div>
      <canvas id="speed-chart"></canvas>
    </section>
  </aside>

  <section class="center">
    <section class="map-card">
      <div id="map">
        <div id="tiles"></div>
        <canvas id="map-canvas"></canvas>
        <div class="map-overlay">
          <button id="zoom-in" type="button" aria-label="放大">＋</button>
          <button id="zoom-out" type="button" aria-label="缩小">－</button>
          <button id="fit-map" type="button" aria-label="适应视野" title="适应视野">⤢</button>
        </div>
        <div class="map-caption"><strong id="map-device">请选择设备</strong><span id="map-address">位置数据加载后将在这里显示（WGS-84）</span></div>
        <div class="attribution">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
      </div>
    </section>
    <section class="panel" style="flex:none">
      <div class="history">
        <div class="panel-head" style="margin:0"><h2>历史轨迹</h2></div>
        <div class="date-row">
          <label>开始</label><input id="start-time" type="datetime-local">
          <label>结束</label><input id="end-time" type="datetime-local">
          <div class="history-actions">
            <button id="load-history" class="btn secondary" type="button">读取轨迹</button>
            <button id="clear-history" class="btn secondary" type="button">清除</button>
          </div>
        </div>
      </div>
    </section>
  </section>

  <aside class="right">
    <section class="panel">
      <div class="panel-head"><h2>运动状态</h2><span id="motion-pill" class="pill">检测中</span></div>
      <div class="attitude-wrap">
        <canvas id="attitude-canvas" width="300" height="300"></canvas>
        <canvas id="wave-canvas" width="600" height="300"></canvas>
      </div>
      <div class="axis-values">
        <div><label>X 轴 (g)</label><b id="axis-x">–</b></div>
        <div><label>Y 轴 (g)</label><b id="axis-y">–</b></div>
        <div><label>Z 轴 (g)</label><b id="axis-z">–</b></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>实时遥测</h2><span id="position-mode" class="pill">等待定位</span></div>
      <div class="metrics">
        <div class="metric"><label>速度</label><b id="m-speed">–</b><span class="unit">km/h</span><small id="m-speed-time"></small></div>
        <div class="metric"><label>航向</label><b id="m-course">–</b><span class="unit">°</span><small id="m-course-dir"></small></div>
      </div>
      <div class="telemetry-list" style="margin-top:12px">
        <div><label>电压</label><b id="t-voltage">–</b></div>
        <div><label>信号强度</label><b id="t-signal">–</b></div>
        <div><label>固件版本</label><b id="t-firmware">–</b></div>
        <div><label>经度 WGS-84</label><b id="t-lng">–</b></div>
        <div><label>纬度 WGS-84</label><b id="t-lat">–</b></div>
        <div><label>设备编号</label><b id="t-imei">–</b></div>
        <div><label>最近上报</label><b id="t-updated">–</b></div>
      </div>
    </section>
  </aside>
</main>

<section id="app-loading" class="page-state">
  <div class="state-card"><div class="spinner"></div><h2>正在读取设备</h2><p>正在获取项目、设备与最新位置…</p></div>
</section>
<section id="app-empty" class="page-state hidden">
  <div class="state-card"><h2>暂时没有可显示的设备</h2><p id="empty-message">当前账号下未找到项目或设备。</p></div>
</section>
<section id="app-error" class="page-state hidden">
  <div class="state-card"><h2>数据读取失败</h2><p id="error-message"></p><button id="retry" class="btn" type="button">重新读取</button></div>
</section>
<div id="toast" class="toast hidden" role="alert"></div>

<script>
/* ===================================================================
 * 合宙 IoT 平台开放接口核心（与官方 Web 客户端规则一致）
 *  - OAuth:  GET  https://api-iot.luatos.com/iam/luat_oauth/authorize?return_to=<回调>
 *            POST https://api-iot.luatos.com/iam/luat_oauth/v2/login?token=<授权码>
 *  - 数据:   POST https://api-iot.luatos.com/iot/open_api/<接口>
 *            请求头: authorization / salt / sid
 *            响应:   { code: 0, value: ... }   102/103/105 表示登录失效
 * =================================================================== */
(function (global) {
  'use strict';
  const API_HOST = 'https://api-iot.luatos.com';
  const BASE_HOST = 'https://iot.luatos.com';
  const AUTH_KEYS = ['my_auth','my_service','my_profile','my_tenant','my_sets','m_auth','m_service','m_profile','m_sets'];
  const HOST_PARAMS = ['m_token','m_salt','m_sid','m_name','m_phone','m_algorithm','m_encryptOutput','m_padding','m_publicKey','m_publicKeyEncoding'];
  const SECRET_PARAMS = ['token','salt','sid'].concat(HOST_PARAMS);
  function safeError(type, message, status) { const e = new Error(message); e.type = type; if (status) e.status = status; return e; }
  const storage = {
    get(key) { try { const raw = localStorage.getItem(key); if (!raw) return null; const value = JSON.parse(raw); return value && typeof value === 'object' ? value : null; } catch (_) { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (_) { return false; } },
    remove(key) { try { localStorage.removeItem(key); return true; } catch (_) { return false; } },
    clear(keys) { try { keys.forEach(k => localStorage.removeItem(k)); return true; } catch (_) { return false; } }
  };
  const LuatSDK = {
    config: { API_HOST, BASE_HOST, API_BASE: API_HOST + '/iot/open_api', OAUTH_URL: API_HOST + '/iam/luat_oauth/authorize', timeout: 15000 },
    storage,
    http: {
      async request(options) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), options.timeout || LuatSDK.config.timeout);
        try {
          const init = { method: options.method || 'GET', headers: Object.assign({}, options.headers || {}), signal: controller.signal };
          if (options.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(options.body); }
          const response = await fetch(options.url, init);
          if (!response.ok) throw safeError('http', '服务暂时不可用，请稍后重试', response.status);
          try { return await response.json(); } catch (_) { throw safeError('parse', '服务返回的数据格式无法识别'); }
        } catch (error) {
          if (error && error.name === 'AbortError') throw safeError('timeout', '请求超时，请检查网络后重试');
          if (error && error.type) throw error;
          throw safeError('network', '网络连接失败，请检查网络后重试');
        } finally { clearTimeout(timer); }
      },
      post(url, body, headers) { return this.request({ method: 'POST', url, body, headers }); }
    }
  };
  function isText(v) { return typeof v === 'string' && v.trim().length > 0; }
  function hostSession() { try { return sessionStorage.getItem('m_host_session') === '1'; } catch (_) { return false; } }
  function setHostSession() { try { sessionStorage.setItem('m_host_session', '1'); } catch (_) {} }
  function validContext(auth, service) { return !!(auth && service && isText(auth.token) && isText(auth.salt) && isText(service.sid)); }
  function readContext(prefix) {
    const auth = storage.get(prefix + '_auth'); const service = storage.get(prefix + '_service');
    if (!validContext(auth, service)) return null;
    const rawProfile = storage.get(prefix + '_profile') || {};
    return { source: prefix, auth, service, profile: { name: rawProfile.name || rawProfile.user_name || '', mobile: rawProfile.mobile || rawProfile.user_phone || '' }, sets: storage.get(prefix + '_sets') || {} };
  }
  function getAuthContext() { if (hostSession()) return readContext('m'); return readContext('my') || readContext('m'); }
  function getAuthHeaders() { const c = getAuthContext(); if (!c) return null; return { authorization: c.auth.token, salt: c.auth.salt, sid: c.service.sid }; }
  function isAuthenticated() { return !!getAuthContext(); }
  function maskPhone(value) { const s = String(value || ''); return s.length >= 7 ? s.slice(0, 3) + '****' + s.slice(-4) : s; }
  function cleanUrl(names) { try { const u = new URL(location.href); names.forEach(n => { u.searchParams.delete(n); if (u.hash) { const h = new URLSearchParams(u.hash.replace(/^#/, '')); h.delete(n); u.hash = h.toString() ? '#' + h.toString() : ''; } }); history.replaceState(null, '', u.pathname + (u.search ? u.search : '') + (u.hash || '')); } catch (_) {} }
  function readParam(name) { try { const u = new URL(location.href); const q = u.searchParams.get(name); if (q !== null) return q; return new URLSearchParams(u.hash.replace(/^#/, '')).get(name); } catch (_) { return null; } }
  function initExternalAuth() {
    const values = {}; HOST_PARAMS.forEach(k => { const v = readParam(k); if (isText(v)) values[k] = v; });
    const complete = isText(values.m_token) && isText(values.m_salt) && isText(values.m_sid);
    if (complete) {
      const saved = storage.set('m_auth', { token: values.m_token, salt: values.m_salt }) && storage.set('m_service', { sid: values.m_sid });
      if (saved) setHostSession();
    }
    if (isText(values.m_name) || isText(values.m_phone)) storage.set('m_profile', { name: values.m_name || '', mobile: values.m_phone || '' });
    if (Object.keys(values).length) cleanUrl(HOST_PARAMS);
    return complete;
  }
  function clearLoginStorage() { const keys = hostSession() ? ['m_auth','m_service','m_profile','m_sets'] : AUTH_KEYS; storage.clear(keys); }
  function extractAppId() { const match = location.pathname.match(/\/ai_app\/luatos\/([^/]+)/); return match ? decodeURIComponent(match[1]) : ''; }
  function isLocal() { return location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname); }
  function pagePath(name) { const id = extractAppId(); return id ? '/ai_app/luatos/' + encodeURIComponent(id) + '/' + name : '/' + name; }
  function pageUrl(name) { return isLocal() ? name : BASE_HOST + pagePath(name); }
  function safeReturnTo(value) { if (!isText(value)) return null; let v = value.trim(); if (v.startsWith(BASE_HOST)) v = v.slice(BASE_HOST.length); if (!v.startsWith('/') || v.startsWith('//') || v.startsWith('/\\') || /(?:https?:|javascript:)/i.test(v)) return null; const low = v.toLowerCase(); if (SECRET_PARAMS.some(k => low.includes(k.toLowerCase() + '='))) return null; return v; }
  function redirectToApp(returnTo) { const safe = safeReturnTo(returnTo); location.assign(safe && !isLocal() ? BASE_HOST + safe : pageUrl('index.html')); }
  function redirectToLogin() { const target = safeReturnTo(location.pathname + location.search) || pagePath('index.html'); const url = new URL(pageUrl('login.html'), location.href); url.searchParams.set('returnTo', target); location.replace(url.href); }
  function requireAuth() { if (!isAuthenticated()) { redirectToLogin(); return false; } return true; }
  function handleLoginExpired() { clearLoginStorage(); redirectToLogin(); }
  async function request(options) {
    const headers = getAuthHeaders();
    if (!headers) { handleLoginExpired(); throw safeError('auth', '登录已失效，请重新登录'); }
    const result = await LuatSDK.http.request({ method: 'POST', url: options.url.startsWith('http') ? options.url : LuatSDK.config.API_BASE + options.url, headers: Object.assign({}, headers, options.headers || {}), body: options.body, timeout: options.timeout });
    if (!result || typeof result.code !== 'number') throw safeError('business', '服务返回的数据不完整');
    if ([102, 103, 105].includes(result.code)) { handleLoginExpired(); throw safeError('auth', '登录已失效，请重新登录'); }
    if (result.code !== 0) throw safeError('business', typeof result.value === 'string' ? result.value : '数据读取失败');
    return result;
  }
  global.MotionCore = { LuatSDK, storage, getAuthContext, getAuthHeaders, isAuthenticated, requireAuth, initAuth: initExternalAuth, handleLoginExpired, clearLoginStorage, request, maskPhone, hostSession, cleanUrl, readParam, pageUrl, redirectToLogin, redirectToApp, safeReturnTo };
})(window);
</script>
<script>
(function () {
  'use strict';
  const C = window.MotionCore;

  /* ---------------- 平台数据流标签（Air8202 运动传感器项目约定） ---------------- */
  const TAGS = { lng: 512, lat: 513, speed: 514, course: 518, signal: 782, voltage: 799, firmware: 1027, snapshot: 1292, stream: 1293, track: 1294 };
  const TILE_TEMPLATE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

  const state = {
    projects: [], devices: [], locations: new Map(), selected: '', project: '',
    telemetry: {}, history: [], sampleQueue: [], lastStreamKey: '',
    magnitudeWindow: [], motionMode: 'unknown', previousSample: null,
    wave: [], timers: [], map: null, lastTelemetryAt: 0
  };

  const $ = id => document.getElementById(id);
  function text(id, value) { $(id).textContent = (value === null || value === undefined || value === '') ? '–' : String(value); }
  function toast(message) { const el = $('toast'); el.textContent = message; el.classList.remove('hidden'); clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.add('hidden'), 4200); }
  function showState(which, message) {
    ['app-loading', 'app-empty', 'app-error'].forEach(id => $(id).classList.add('hidden'));
    if (which) { $(which).classList.remove('hidden'); if (which === 'app-error') text('error-message', message); if (which === 'app-empty') text('empty-message', message); }
  }
  function numeric(v) { const n = Number(v); return Number.isFinite(n) ? n : null; }

  /* ---------------- 三轴姿态（立方体）与波形 ---------------- */

    $('position-mode').className = 'pill ' + (coord ? 'ok' : '');
    if (state.map) state.map.draw();
  }

  /* ---------------- 业务流程 ---------------- */
  async function selectDevice(id) {
    if (!id || (id === state.selected && state.telemetry[id])) return;
    state.selected = id;
    state.history = [];
    state.sampleQueue = [];
    state.lastStreamKey = '';
    state.previousSample = null;
    state.magnitudeWindow = [];
    state.motionMode = 'unknown';
    state.wave = [];
    renderDevices(); renderSelected(); drawSpeedChart([]); drawWave();
    const p = getCoord(state.locations.get(id));
    if (p) state.map.fit([p]);
    await loadTelemetry(id);
  }
  async function refreshLocations(fit) {
    if (!state.devices.length) return;
    const results = await mapLimit(state.devices, 4, async d => [String(d.deviceid), await latestLocation(String(d.deviceid))]);
    results.forEach(([id, loc]) => { if (loc) state.locations.set(id, loc); });
    renderDevices(); renderSelected();
    if (fit) {
      const pts = Array.from(state.locations.values()).map(getCoord).filter(Boolean);
      if (pts.length) state.map.fit(pts);
    }
  }
  async function changeProject() {
    state.project = $('project-select').value;
    state.devices = []; state.selected = ''; state.locations.clear(); state.telemetry = {}; state.history = [];
    showState('app-loading');
    try {
      state.devices = await loadDevices(state.project);
      renderDevices();
      await refreshLocations(true);
      if (state.devices.length) await selectDevice(String(state.devices[0].deviceid));
      showState(null);
    } catch (e) {
      if (e.type === 'auth') return;
      showState('app-error', e.message || '设备读取失败');
    }
  }
  async function boot() {
    if (!C.requireAuth()) return;
    state.map = new SimpleMap();
    showState('app-loading');
    const profile = C.getAuthContext();
    $('user-name').textContent = profile ? C.maskPhone(profile.profile.mobile || profile.profile.name || '') : '';
    try {
      state.projects = await loadProjects();
      if (!state.projects.length) { showState('app-empty', '当前账号下没有项目，请先在合宙 IoT 平台创建产品与设备。'); return; }
      state.project = state.projects[0].project_key;
      renderProjects();
      await changeProject();
      runSamples();
      state.timers.push(setInterval(() => { if (state.selected) loadTelemetry(state.selected); }, 8000));
      state.timers.push(setInterval(() => refreshLocations(false).catch(() => {}), 20000));
    } catch (e) {
      if (e.type === 'auth') return;
      showState('app-error', e.message || '初始化失败');
    }
  }
  async function loadHistory() {
    if (!state.selected) { toast('请先选择设备'); return; }
    const start = $('start-time').value, end = $('end-time').value;
    if (!start || !end || new Date(end) <= new Date(start)) { toast('请选择有效的轨迹时间范围'); return; }
    const btn = $('load-history');
    btn.disabled = true; btn.textContent = '正在读取…';
    try {
      const rows = await allPages('/aircloud/location_history', { client_id: state.selected, start, end });
      state.history = rows.map(r => {
        const lng = numeric(r.wlng) !== null ? numeric(r.wlng) : numeric(r.lng);
        const lat = numeric(r.wlat) !== null ? numeric(r.wlat) : numeric(r.lat);
        return { lng, lat, time: r.time };
      }).filter(p => p.lng !== null && p.lat !== null);
      if (state.map) state.map.draw();
      if (state.history.length) state.map.fit(state.history);
      else toast('该时间段没有轨迹数据');
    } catch (e) { if (e.type !== 'auth') toast(e.message || '轨迹读取失败'); }
    finally { btn.disabled = false; btn.textContent = '读取轨迹'; }
  }
  function logout() {
    state.timers.forEach(clearInterval);
    C.clearLoginStorage();
    location.replace(C.pageUrl('login.html'));
  }

  /* ---------------- 事件绑定与启动 ---------------- */
  function bind() {
    $('project-select').addEventListener('change', changeProject);
    $('retry').addEventListener('click', boot);
    $('load-history').addEventListener('click', loadHistory);
    $('clear-history').addEventListener('click', () => { state.history = []; if (state.map) { state.map.draw(); state.map.fit([getCoord(state.locations.get(state.selected))].filter(Boolean)); } });
    $('zoom-in').addEventListener('click', () => { state.map.zoom = Math.min(19, state.map.zoom + 1); state.map.draw(); });
    $('zoom-out').addEventListener('click', () => { state.map.zoom = Math.max(2, state.map.zoom - 1); state.map.draw(); });
    $('fit-map').addEventListener('click', () => state.map.fit(Array.from(state.locations.values()).map(getCoord).filter(Boolean)));
    $('logout').addEventListener('click', logout);
    const now = new Date();
    $('end-time').value = formatLocalInput(now);
    $('start-time').value = formatLocalInput(new Date(now.getTime() - 6 * 3600 * 1000));
    window.addEventListener('resize', () => { if (state.map) state.map.draw(); drawCube(); drawWave(); });
  }
  document.addEventListener('DOMContentLoaded', () => { bind(); boot(); });
})();
</script>
</body>
</html>

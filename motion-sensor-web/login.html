<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f0d">
<title>MotionPulse 运动传感器 · 登录</title>
<style>
:root{color-scheme:dark;--bg:#0a0f0d;--panel:#111a15;--line:#22352b;--text:#eef5f0;--muted:#8fa79a;--lime:#b6f34a;--cyan:#41d5d7;--red:#ff6b6b;font-family:Inter,"Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.btn{border:0;border-radius:12px;padding:.8rem 1rem;font-weight:750;background:var(--lime);color:#15230a;min-height:46px;width:100%;font-size:1rem}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.status-error{color:#ffd8d8;background:#3a2026;border:1px solid #6b3038;padding:.8rem 1rem;border-radius:12px;font-size:.9rem}
.spinner{width:26px;height:26px;border:3px solid #ffffff22;border-top-color:var(--lime);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body{display:grid;place-items:center;padding:24px;overflow:hidden}
.pulse{position:fixed;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#b6f34a1f,transparent 65%);right:-160px;bottom:-180px;animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.08);opacity:1}}
.grid{position:fixed;inset:0;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,#000,transparent)}
.login-card{position:relative;width:min(100%,450px);background:linear-gradient(150deg,#12201aee,#0c1410ee);border:1px solid #2a4034;border-radius:26px;padding:38px;box-shadow:0 30px 80px #0009}
.brand{display:flex;gap:14px;align-items:center;margin-bottom:38px}
.brand-mark{width:46px;height:46px;border-radius:14px;background:var(--lime);display:grid;place-items:center;color:#15230a;font-weight:900;font-size:1.3rem}
.brand span{font-size:1.2rem;font-weight:800}
.eyebrow{color:var(--lime);font-size:.76rem;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.login-card h1{font-size:clamp(1.8rem,7vw,2.6rem);line-height:1.12;margin:.55rem 0 1rem}
.login-card p{color:var(--muted);line-height:1.75;margin:0 0 28px;font-size:.95rem}
.feats{display:grid;gap:9px;margin:0 0 30px;padding:0;list-style:none}
.feats li{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.88rem}
.feats i{width:7px;height:7px;border-radius:50%;background:var(--lime);flex:none}
.login-card footer{margin-top:24px;color:#688075;font-size:.78rem;text-align:center;line-height:1.6}
.loading-row{display:flex;align-items:center;justify-content:center;gap:12px;min-height:48px;color:var(--muted)}
#login-error{margin-top:16px}
@media(max-width:480px){.login-card{padding:28px 22px;border-radius:22px}}
</style>
</head>
<body>
<div class="grid"></div><div class="pulse"></div>
<main class="login-card">
  <div class="brand"><div class="brand-mark">M</div><span>MotionPulse 运动传感器</span></div>
  <section id="login-container">
    <div class="eyebrow">Luat IoT · Air8202</div>
    <h1>登录后查看设备实时运动数据</h1>
    <p>基于合宙 IoT 平台开放接口，实时呈现设备的加速度三轴波形、运动状态、位置轨迹、速度与电量信号。</p>
    <ul class="feats">
      <li><i></i>三轴加速度实时姿态与波形</li>
      <li><i></i>运动状态智能判定（静止 / 活动 / 剧烈）</li>
      <li><i></i>最新位置与历史轨迹地图</li>
      <li><i></i>速度、航向、信号、电量遥测</li>
    </ul>
    <button id="login-button" class="btn" type="button">使用合宙账号登录</button>
  </section>
  <section id="login-loading" class="loading-row hidden" aria-live="polite">
    <div class="spinner"></div><span>正在确认登录状态…</span>
  </section>
  <section id="login-error" class="status-error hidden" role="alert"></section>
  <footer>授权信息仅用于读取当前账号下的设备数据，不会写入任何数据</footer>
</main>
<script>
(function (global) {
  'use strict';
  const API_HOST = 'https://api-iot.luatos.com';
  const BASE_HOST = 'https://iot.luatos.com';
  const AUTH_KEYS = ['my_auth','my_service','my_profile','my_tenant','my_sets','m_auth','m_service','m_profile','m_sets'];
  const HOST_PARAMS = ['m_token','m_salt','m_sid','m_name','m_phone','m_algorithm','m_encryptOutput','m_padding','m_publicKey','m_publicKeyEncoding'];
  const SECRET_PARAMS = ['token','salt','sid'].concat(HOST_PARAMS);
  function safeError(type, message, status) { const e = new Error(message); e.type = type; if (status) e.status = status; return e; }
  const storage = {
    get(key) { try { const raw = localStorage.getItem(key); if (!raw) return null; const value = JSON.parse(raw); return value && typeof value === 'object' ? value : null; } catch (_) { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); return true; } catch (_) { return false; } },
    remove(key) { try { localStorage.removeItem(key); return true; } catch (_) { return false; } },
    clear(keys) { try { keys.forEach(k => localStorage.removeItem(k)); return true; } catch (_) { return false; } }
  };
  const LuatSDK = {
    config: { API_HOST, BASE_HOST, API_BASE: API_HOST + '/iot/open_api', OAUTH_URL: API_HOST + '/iam/luat_oauth/authorize', timeout: 15000 },
    storage,
    http: {
      async request(options) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), options.timeout || LuatSDK.config.timeout);
        try {
          const init = { method: options.method || 'GET', headers: Object.assign({}, options.headers || {}), signal: controller.signal };
          if (options.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(options.body); }
          const response = await fetch(options.url, init);
          if (!response.ok) throw safeError('http', '服务暂时不可用，请稍后重试', response.status);
          try { return await response.json(); } catch (_) { throw safeError('parse', '服务返回的数据格式无法识别'); }
        } catch (error) {
          if (error && error.name === 'AbortError') throw safeError('timeout', '请求超时，请检查网络后重试');
          if (error && error.type) throw error;
          throw safeError('network', '网络连接失败，请检查网络后重试');
        } finally { clearTimeout(timer); }
      },
      post(url, body, headers) { return this.request({ method: 'POST', url, body, headers }); }
    }
  };
  function isText(v) { return typeof v === 'string' && v.trim().length > 0; }
  function hostSession() { try { return sessionStorage.getItem('m_host_session') === '1'; } catch (_) { return false; } }
  function setHostSession() { try { sessionStorage.setItem('m_host_session', '1'); } catch (_) {} }
  function validContext(auth, service) { return !!(auth && service && isText(auth.token) && isText(auth.salt) && isText(service.sid)); }
  function readContext(prefix) {
    const auth = storage.get(prefix + '_auth'); const service = storage.get(prefix + '_service');
    if (!validContext(auth, service)) return null;
    const rawProfile = storage.get(prefix + '_profile') || {};
    return { source: prefix, auth, service, profile: { name: rawProfile.name || rawProfile.user_name || '', mobile: rawProfile.mobile || rawProfile.user_phone || '' }, sets: storage.get(prefix + '_sets') || {} };
  }
  function getAuthContext() { if (hostSession()) return readContext('m'); return readContext('my') || readContext('m'); }
  function getAuthHeaders() { const c = getAuthContext(); if (!c) return null; return { authorization: c.auth.token, salt: c.auth.salt, sid: c.service.sid }; }
  function isAuthenticated() { return !!getAuthContext(); }
  function cleanUrl(names) { try { const u = new URL(location.href); names.forEach(n => { u.searchParams.delete(n); if (u.hash) { const h = new URLSearchParams(u.hash.replace(/^#/, '')); h.delete(n); u.hash = h.toString() ? '#' + h.toString() : ''; } }); history.replaceState(null, '', u.pathname + (u.search ? u.search : '') + (u.hash || '')); } catch (_) {} }
  function readParam(name) { try { const u = new URL(location.href); const q = u.searchParams.get(name); if (q !== null) return q; return new URLSearchParams(u.hash.replace(/^#/, '')).get(name); } catch (_) { return null; } }
  function initExternalAuth() {
    const values = {}; HOST_PARAMS.forEach(k => { const v = readParam(k); if (isText(v)) values[k] = v; });
    const complete = isText(values.m_token) && isText(values.m_salt) && isText(values.m_sid);
    if (complete) {
      const saved = storage.set('m_auth', { token: values.m_token, salt: values.m_salt }) && storage.set('m_service', { sid: values.m_sid });
      if (saved) setHostSession();
    }
    if (isText(values.m_name) || isText(values.m_phone)) storage.set('m_profile', { name: values.m_name || '', mobile: values.m_phone || '' });
    const sets = {}; [['m_algorithm','algorithm'],['m_encryptOutput','encryptOutput'],['m_padding','padding'],['m_publicKey','publicKey'],['m_publicKeyEncoding','publicKeyEncoding']].forEach(p => { if (isText(values[p[0]])) sets[p[1]] = values[p[0]]; });
    if (Object.keys(sets).length) storage.set('m_sets', sets);
    if (Object.keys(values).length) cleanUrl(HOST_PARAMS);
    return complete;
  }
  function clearLoginStorage() { const keys = hostSession() ? ['m_auth','m_service','m_profile','m_sets'] : AUTH_KEYS; storage.clear(keys); }
  function extractAppId() { const match = location.pathname.match(/\/ai_app\/luatos\/([^/]+)/); return match ? decodeURIComponent(match[1]) : ''; }
  function isLocal() { return location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname); }
  function pagePath(name) { const id = extractAppId(); return id ? '/ai_app/luatos/' + encodeURIComponent(id) + '/' + name : '/' + name; }
  function pageUrl(name) { return isLocal() ? name : BASE_HOST + pagePath(name); }
  function safeReturnTo(value) { if (!isText(value)) return null; let v = value.trim(); if (v.startsWith(BASE_HOST)) v = v.slice(BASE_HOST.length); if (!v.startsWith('/') || v.startsWith('//') || v.startsWith('/\\') || /(?:https?:|javascript:)/i.test(v)) return null; const low = v.toLowerCase(); if (SECRET_PARAMS.some(k => low.includes(k.toLowerCase() + '='))) return null; return v; }
  function redirectToApp(returnTo) { const safe = safeReturnTo(returnTo); location.assign(safe && !isLocal() ? BASE_HOST + safe : pageUrl('index.html')); }
  function safeError0(m){const e=new Error(m);return e}
  global.MotionCore = { LuatSDK, storage, getAuthContext, getAuthHeaders, isAuthenticated, cleanUrl, readParam, hostSession, clearLoginStorage, initExternalAuth, pageUrl, pagePath, safeReturnTo, redirectToApp, safeError: safeError0 };
})(window);
</script>
<script>
(function () {
  'use strict';
  const C = window.MotionCore;
  let busy = false;
  const ui = { box: null, loading: null, error: null, button: null };
  function showLogin() { ui.box.classList.remove('hidden'); ui.loading.classList.add('hidden'); ui.button.disabled = false; busy = false; }
  function showLoading() { ui.box.classList.add('hidden'); ui.loading.classList.remove('hidden'); ui.error.classList.add('hidden'); }
  function showError(message) { ui.error.textContent = message; ui.error.classList.remove('hidden'); showLogin(); }
  function oauthCallback() {
    const parts = location.pathname.split('/');
    const marker = parts.indexOf('luatos');
    const id = marker > 0 ? parts[marker + 1] : '';
    return id ? C.LuatSDK.config.BASE_HOST + '/ai_app/luatos/' + encodeURIComponent(decodeURIComponent(id)) + '/login.html' : C.pageUrl('login.html');
  }
  async function completeLogin(token) {
    showLoading();
    try {
      const result = await C.LuatSDK.http.post(C.LuatSDK.config.API_HOST + '/iam/luat_oauth/v2/login?token=' + encodeURIComponent(token));
      if (!result || result.code !== 0 || !result.value || !result.value.auth || !result.value.service
        || typeof result.value.auth.token !== 'string' || !result.value.auth.token.trim()
        || typeof result.value.auth.salt !== 'string' || !result.value.auth.salt.trim()
        || typeof result.value.service.sid !== 'string' || !result.value.service.sid.trim()) {
        throw new Error(typeof (result && result.value) === 'string' ? result.value : '登录信息不完整，请重新登录');
      }
      const v = result.value;
      const saved = [];
      try {
        if (!C.storage.set('my_auth', v.auth)) throw 0; saved.push('my_auth');
        if (!C.storage.set('my_service', v.service)) throw 0; saved.push('my_service');
        if (!C.storage.set('my_profile', v.user || {})) throw 0; saved.push('my_profile');
        if (v.tenant) { if (!C.storage.set('my_tenant', v.tenant)) throw 0; saved.push('my_tenant'); }
        if (v.sets) { if (!C.storage.set('my_sets', v.sets)) throw 0; saved.push('my_sets'); }
      } catch (_) { saved.forEach(k => C.storage.remove(k)); throw new Error('浏览器无法保存登录状态，请允许本地存储后重试'); }
      const returnTo = new URL(location.href).searchParams.get('returnTo');
      C.redirectToApp(returnTo);
    } catch (e) { showError(e && e.message ? e.message : '登录失败，请重试'); }
  }
  function startOAuth() {
    if (busy) return;
    busy = true;
    ui.button.disabled = true;
    showLoading();
    C.cleanUrl(['token', 'error', 'error_description']);
    const url = C.LuatSDK.config.OAUTH_URL + '?return_to=' + encodeURIComponent(oauthCallback());
    location.assign(url);
  }
  function init() {
    ui.box = document.getElementById('login-container');
    ui.loading = document.getElementById('login-loading');
    ui.error = document.getElementById('login-error');
    ui.button = document.getElementById('login-button');
    ui.button.addEventListener('click', startOAuth);
    const oauthError = C.readParam('error');
    const description = C.readParam('error_description');
    const token = C.readParam('token');
    C.initExternalAuth();
    if (oauthError) { C.cleanUrl(['error', 'error_description', 'token']); showError(description || '授权未完成，请重试'); return; }
    if (C.isAuthenticated()) { C.cleanUrl(['token']); C.redirectToApp(new URL(location.href).searchParams.get('returnTo')); return; }
    if (C.hostSession()) { C.cleanUrl(['token']); showError('登录状态已失效，请重新进入应用'); ui.button.classList.add('hidden'); return; }
    if (token) { C.cleanUrl(['token']); completeLogin(token); return; }
    showLogin();
  }
  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
